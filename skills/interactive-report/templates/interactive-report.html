<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>

  <style>
    /* ===== CSS Variables ===== */
    :root {
      --color-strategy: #1e3a8a;
      --color-strategy-light: #dbeafe;
      --color-theory: #87a96b;
      --color-theory-light: #f0f4ec;
      --color-target: #c65d07;
      --color-target-light: #fef3e2;
      --color-arch: #78716c;
      --color-arch-light: #f5f5f4;
      --color-growth: #7c3aed;
      --color-growth-light: #ede9fe;

      --bg-primary: #ffffff;
      --bg-sidebar: #f8f9fa;
      --text-primary: #374151;
      --text-secondary: #6b7280;
      --text-light: #9ca3af;
      --border-color: #e5e7eb;

      --sidebar-width: 280px;
      --header-height: 56px;
      --border-radius: 12px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
    }

    /* ===== Reset ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
      color: var(--text-primary);
      background: var(--bg-primary);
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Layout ===== */
    .layout {
      display: flex;
      min-height: 100vh;
    }

    /* ===== Sidebar ===== */
    .sidebar {
      width: var(--sidebar-width);
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      overflow-y: auto;
      z-index: 100;
      transition: transform 0.3s ease;
      padding: 24px 0;
    }

    .sidebar-header {
      padding: 0 20px 20px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    .sidebar-logo {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-strategy);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-logo::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 24px;
      background: linear-gradient(to bottom, var(--color-strategy), var(--color-theory));
      border-radius: 4px;
    }

    .sidebar nav { padding: 0 12px; }

    .toc-list {
      list-style: none;
      font-size: 14px;
    }

    .toc-item {
      margin-bottom: 2px;
    }

    .toc-link {
      display: block;
      padding: 8px 12px;
      color: var(--text-secondary);
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.2s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toc-link:hover {
      background: rgba(0,0,0,0.04);
      color: var(--text-primary);
    }

    .toc-link.active {
      background: var(--color-strategy-light);
      color: var(--color-strategy);
      font-weight: 600;
    }

    .toc-link.level-2 {
      padding-left: 28px;
      font-size: 13px;
    }

    .toc-link.level-3 {
      padding-left: 44px;
      font-size: 12px;
    }

    /* ===== Main Content ===== */
    .main-content {
      flex: 1;
      margin-left: var(--sidebar-width);
      min-width: 0;
    }

    .content-wrapper {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 48px 80px;
    }

    /* ===== Hero Section ===== */
    .hero {
      text-align: center;
      padding: 60px 0 48px;
      margin-bottom: 48px;
      position: relative;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 3px;
      background: linear-gradient(to right, var(--color-strategy), var(--color-theory));
      border-radius: 2px;
    }

    .hero h1 {
      font-size: 32px;
      font-weight: 800;
      color: var(--color-strategy);
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .hero .subtitle {
      font-size: 18px;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .hero .description {
      font-size: 15px;
      color: var(--text-light);
      max-width: 640px;
      margin: 0 auto;
      line-height: 1.8;
    }

    /* ===== Stats Row ===== */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 48px;
    }

    .stat-card {
      background: var(--bg-primary);
      border-radius: var(--border-radius);
      padding: 24px;
      text-align: center;
      box-shadow: var(--shadow-md);
      border-top: 3px solid var(--card-color, var(--color-strategy));
      transition: transform 0.2s;
    }

    .stat-card:hover { transform: translateY(-2px); }

    .stat-value {
      font-size: 36px;
      font-weight: 800;
      color: var(--card-color, var(--color-strategy));
      line-height: 1.2;
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 8px;
    }

    /* ===== Chapter ===== */
    .chapter {
      margin-bottom: 48px;
      border-left: 4px solid var(--chapter-color, var(--color-strategy));
      padding-left: 0;
      scroll-margin-top: 24px;
    }

    .chapter-header {
      padding: 16px 24px;
      background: linear-gradient(135deg, var(--chapter-color, var(--color-strategy)), rgba(255,255,255,0.3));
      background-color: var(--chapter-color, var(--color-strategy));
      border-radius: 0 var(--border-radius) var(--border-radius) 0;
      margin-bottom: 24px;
    }

    .chapter-header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
    }

    .chapter-header h2 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }

    .chapter-body { padding: 0 24px; }

    /* ===== Content Card ===== */
    .content-card {
      background: var(--bg-primary);
      border-radius: var(--border-radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
    }

    .content-card h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--chapter-color, var(--color-strategy));
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border-color);
    }

    .content-card h3 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 16px 0 8px;
    }

    .content-card p {
      margin-bottom: 12px;
      text-align: justify;
    }

    .content-card ul, .content-card ol {
      margin: 8px 0 16px 20px;
    }

    .content-card li {
      margin-bottom: 4px;
    }

    /* ===== Badge ===== */
    .badge {
      display: inline-block;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 100px;
      margin-right: 6px;
      margin-bottom: 4px;
    }

    .badge-strategy { background: var(--color-strategy-light); color: var(--color-strategy); }
    .badge-theory { background: var(--color-theory-light); color: var(--color-theory); }
    .badge-target { background: var(--color-target-light); color: var(--color-target); }
    .badge-arch { background: var(--color-arch-light); color: var(--color-arch); }
    .badge-growth { background: var(--color-growth-light); color: var(--color-growth); }

    /* ===== Chart Container ===== */
    .chart-container {
      width: 100%;
      height: 350px;
      margin: 20px 0;
      border-radius: var(--border-radius);
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
    }

    /* ===== Mermaid Container ===== */
    .mermaid-container {
      margin: 20px 0;
      padding: 24px;
      background: #fafbfc;
      border-radius: var(--border-radius);
      border: 1px solid var(--border-color);
      overflow-x: auto;
      text-align: center;
    }

    .mermaid {
      display: flex;
      justify-content: center;
    }

    .mermaid svg {
      max-width: 100%;
      height: auto;
    }

    /* ===== Progress Bar ===== */
    .progress-bar-wrapper {
      margin: 12px 0;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .progress-bar {
      height: 8px;
      background: var(--border-color);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 1s ease;
    }

    /* ===== Reference List ===== */
    .ref-list {
      font-size: 13px;
      color: var(--text-secondary);
      padding: 20px 24px;
      background: var(--bg-sidebar);
      border-radius: var(--border-radius);
      margin-top: 40px;
    }

    .ref-list h3 {
      font-size: 16px;
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    .ref-list ol {
      margin-left: 20px;
    }

    .ref-list li {
      margin-bottom: 6px;
      line-height: 1.6;
    }

    /* ===== Back to Top ===== */
    .back-to-top {
      position: fixed;
      bottom: 32px;
      right: 32px;
      width: 44px;
      height: 44px;
      background: var(--color-strategy);
      color: #fff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
      z-index: 90;
      font-size: 18px;
    }

    .back-to-top.visible {
      opacity: 1;
      visibility: visible;
    }

    .back-to-top:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 20px rgba(0,0,0,0.15);
    }

    /* ===== Export Button ===== */
    .export-btn {
      position: fixed;
      bottom: 32px;
      right: 84px;
      padding: 10px 20px;
      background: var(--color-theory);
      color: #fff;
      border: none;
      border-radius: 22px;
      cursor: pointer;
      box-shadow: var(--shadow-lg);
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
      z-index: 90;
    }

    .export-btn.visible {
      opacity: 1;
      visibility: visible;
    }

    .export-btn:hover {
      transform: translateY(-2px);
    }

    /* ===== Mobile Hamburger ===== */
    .hamburger {
      display: none;
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 200;
      width: 40px;
      height: 40px;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-md);
      font-size: 18px;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 99;
    }

    /* ===== Print ===== */
    @media print {
      .sidebar, .hamburger, .back-to-top, .export-btn { display: none !important; }
      .main-content { margin-left: 0 !important; }
      .content-wrapper { padding: 0 !important; max-width: 100% !important; }
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-overlay.open {
        display: block;
      }

      .hamburger {
        display: flex;
      }

      .main-content {
        margin-left: 0;
      }

      .content-wrapper {
        padding: 60px 20px 80px;
      }

      .hero h1 {
        font-size: 24px;
      }

      .stats-row {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .stat-value {
        font-size: 28px;
      }

      .chapter-header h1, .chapter-header h2 {
        font-size: 18px;
      }

      .content-card {
        padding: 16px;
      }

      .back-to-top {
        bottom: 20px;
        right: 20px;
      }

      .export-btn {
        bottom: 20px;
        right: 72px;
        font-size: 12px;
        padding: 8px 14px;
      }
    }

    /* ===== Animations ===== */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chapter {
      animation: fadeInUp 0.5s ease both;
    }
  </style>
</head>

<body>
  <!-- Hamburger Button (mobile) -->
  <button class="hamburger" onclick="toggleSidebar()" aria-label="Toggle navigation">&#9776;</button>

  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <div class="layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">{{TITLE}}</div>
      </div>
      <nav>
        <ul class="toc-list" id="tocList">
          <!-- Auto-generated by JS -->
        </ul>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <div class="content-wrapper" id="contentArea">

        <!-- Hero Section -->
        <div class="hero">
          <h1>{{TITLE}}</h1>
          <div class="subtitle">{{SUBTITLE}}</div>
        </div>

        <!-- Stats Cards -->
        <div class="stats-row">
          {{STATS_CARDS}}
        </div>

        <!-- Chapter Sections (injected by skill) -->
        {{NEXT_SECTION}}

        <!-- References (optional, can be injected as a chapter) -->

      </div>
    </main>
  </div>

  <!-- Back to Top -->
  <button class="back-to-top" id="backToTop" onclick="scrollToTop()">&#8593;</button>

  <!-- Export Button -->
  <button class="export-btn" id="exportBtn" onclick="exportAsImage()">Export as Image</button>

  <!-- CDN Libraries (deferred: load after body renders) -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.0/mermaid.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    /* ===== TOC Auto-Generation ===== */
    function buildTOC() {
      const content = document.getElementById('contentArea');
      if (!content) return;

      const tocList = document.getElementById('tocList');
      if (!tocList) return;

      const headings = content.querySelectorAll('h1, h2, h3');
      tocList.innerHTML = '';

      headings.forEach((heading, index) => {
        // Skip hero title
        if (heading.closest('.hero')) return;

        const id = 'heading-' + index;
        heading.id = id;

        const level = parseInt(heading.tagName.charAt(1));
        const li = document.createElement('li');
        li.className = 'toc-item';

        const a = document.createElement('a');
        a.className = 'toc-link level-' + level;
        a.href = '#' + id;
        a.textContent = heading.textContent;

        a.addEventListener('click', (e) => {
          e.preventDefault();
          const target = document.getElementById(id);
          if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
          closeSidebar();
        });

        li.appendChild(a);
        tocList.appendChild(li);
      });
    }

    /* ===== Scroll Spy ===== */
    function initScrollSpy() {
      const tocLinks = document.querySelectorAll('.toc-link');
      if (tocLinks.length === 0) return;

      const headings = [];
      tocLinks.forEach(link => {
        const id = link.getAttribute('href')?.substring(1);
        if (id) {
          const el = document.getElementById(id);
          if (el) headings.push({ el, link });
        }
      });

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            tocLinks.forEach(l => l.classList.remove('active'));
            const heading = headings.find(h => h.el === entry.target);
            if (heading) {
              heading.link.classList.add('active');
            }
          }
        });
      }, {
        rootMargin: '-80px 0px -60% 0px',
        threshold: 0
      });

      headings.forEach(({ el }) => observer.observe(el));
    }

    /* ===== Back to Top ===== */
    function initBackToTop() {
      const btn = document.getElementById('backToTop');
      const exportBtn = document.getElementById('exportBtn');
      window.addEventListener('scroll', () => {
        if (window.scrollY > 300) {
          btn?.classList.add('visible');
          exportBtn?.classList.add('visible');
        } else {
          btn?.classList.remove('visible');
          exportBtn?.classList.remove('visible');
        }
      });
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ===== Mobile Sidebar ===== */
    function toggleSidebar() {
      document.getElementById('sidebar')?.classList.toggle('open');
      document.getElementById('sidebarOverlay')?.classList.toggle('open');
    }

    function closeSidebar() {
      document.getElementById('sidebar')?.classList.remove('open');
      document.getElementById('sidebarOverlay')?.classList.remove('open');
    }

    /* ===== Mermaid Init ===== */
    function initMermaid() {
      if (typeof mermaid === 'undefined') return;

      mermaid.initialize({
        startOnLoad: false,
        theme: 'base',
        themeVariables: {
          primaryColor: '#87a96b',
          primaryTextColor: '#fff',
          primaryBorderColor: '#6b8e4f',
          lineColor: '#6b8e4f',
          secondaryColor: '#dbeafe',
          tertiaryColor: '#fef3e2'
        }
      });

      document.querySelectorAll('.mermaid').forEach(async (el) => {
        try {
          const id = 'mermaid-' + Math.random().toString(36).substr(2, 9);
          const { svg } = await mermaid.render(id, el.textContent);
          el.innerHTML = svg;
        } catch (err) {
          console.warn('Mermaid render error:', err);
          el.innerHTML = '<p style="color: #999; font-size: 13px;">[Diagram render failed]</p>';
        }
      });
    }

    /* ===== ECharts Components ===== */

    /** Radar Chart */
    function renderRadarChart(containerId, config) {
      const container = document.getElementById(containerId);
      if (!container || typeof echarts === 'undefined') return;

      const chart = echarts.init(container);
      chart.setOption({
        tooltip: { trigger: 'item' },
        radar: {
          indicator: config.indicators,
          shape: 'polygon',
          splitNumber: 5,
          axisName: { color: '#374151', fontSize: 13 },
          splitArea: { areaStyle: { color: ['#fff', '#f8f9fa'] } }
        },
        series: [{
          type: 'radar',
          data: config.series.map(s => ({
            name: s.name,
            value: s.value,
            areaStyle: { opacity: 0.2 },
            lineStyle: { width: 2 }
          }))
        }],
        color: ['#1e3a8a', '#87a96b', '#c65d07', '#7c3aed']
      });

      window.addEventListener('resize', () => chart.resize());
    }

    /** Gauge Chart */
    function renderGaugeChart(containerId, config) {
      const container = document.getElementById(containerId);
      if (!container || typeof echarts === 'undefined') return;

      const chart = echarts.init(container);
      chart.setOption({
        series: [{
          type: 'gauge',
          startAngle: 200,
          endAngle: -20,
          min: 0,
          max: 10,
          detail: {
            valueAnimation: true,
            formatter: '{value}',
            fontSize: 28,
            fontWeight: 'bold',
            offsetCenter: [0, '60%']
          },
          title: {
            offsetCenter: [0, '80%'],
            fontSize: 14,
            color: '#6b7280'
          },
          data: [{ value: config.value, name: config.title }],
          axisLine: {
            lineStyle: {
              width: 20,
              color: [[0.6, '#ef4444'], [0.8, '#f59e0b'], [1, '#22c55e']]
            }
          },
          pointer: { width: 5 },
          axisTick: { show: false },
          splitLine: { length: 12, lineStyle: { width: 2 } },
          axisLabel: { distance: 20, fontSize: 11 }
        }]
      });

      window.addEventListener('resize', () => chart.resize());
    }

    /** Ring Chart */
    function renderRingChart(containerId, config) {
      const container = document.getElementById(containerId);
      if (!container || typeof echarts === 'undefined') return;

      const chart = echarts.init(container);
      chart.setOption({
        tooltip: { trigger: 'item' },
        series: [{
          type: 'pie',
          radius: ['55%', '75%'],
          avoidLabelOverlap: false,
          label: {
            show: true,
            position: 'center',
            formatter: () => config.value + '%',
            fontSize: 32,
            fontWeight: 'bold',
            color: config.color || '#87a96b'
          },
          title: {
            text: config.title,
            left: 'center',
            bottom: 10,
            textStyle: { fontSize: 13, color: '#6b7280' }
          },
          data: [
            {
              value: config.value,
              name: config.title,
              itemStyle: { color: config.color || '#87a96b' }
            },
            {
              value: 100 - config.value,
              name: '',
              itemStyle: { color: '#e5e7eb' }
            }
          ]
        }]
      });

      window.addEventListener('resize', () => chart.resize());
    }

    /** Bar Chart */
    function renderBarChart(containerId, config) {
      const container = document.getElementById(containerId);
      if (!container || typeof echarts === 'undefined') return;

      const chart = echarts.init(container);
      chart.setOption({
        tooltip: { trigger: 'axis' },
        xAxis: {
          type: 'category',
          data: config.categories,
          axisLabel: { fontSize: 12 }
        },
        yAxis: { type: 'value' },
        series: config.series.map(s => ({
          name: s.name,
          type: 'bar',
          data: s.data,
          barWidth: '40%'
        })),
        color: ['#1e3a8a', '#87a96b', '#c65d07', '#7c3aed']
      });

      window.addEventListener('resize', () => chart.resize());
    }

    /* ===== Export as Image ===== */
    function exportAsImage() {
      const content = document.getElementById('contentArea');
      if (!content || typeof html2canvas === 'undefined') return;

      const btn = document.getElementById('exportBtn');
      if (btn) btn.textContent = 'Exporting...';

      html2canvas(content, {
        scale: 2,
        useCORS: true,
        logging: false,
        backgroundColor: '#ffffff'
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = (document.title || 'report') + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        if (btn) btn.textContent = 'Export as Image';
      }).catch(err => {
        console.error('Export error:', err);
        if (btn) btn.textContent = 'Export as Image';
      });
    }

    /* ===== Chart Init Placeholder ===== */
    // Chart init code will be called after CDN scripts load

    /* ===== Entry Point ===== */
    document.addEventListener('DOMContentLoaded', () => {
      buildTOC();
      initScrollSpy();
      initBackToTop();

      // Wait for deferred CDN scripts to load before rendering charts/mermaid
      // defer scripts execute before DOMContentLoaded, so echarts/mermaid should be available
      {{CHART_INIT}}
      initMermaid();
    });
  </script>
</body>
</html>
