services:
  hermes-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: patent-hermes-agent:latest
    container_name: patent-hermes-agent
    restart: unless-stopped
    # 端口映射：容器内端口由 DASHBOARD_CONTAINER_PORT / GATEWAY_CONTAINER_PORT / OUTPUT_CONTAINER_PORT 控制
    # 宿主机映射端口由 DASHBOARD_HOST_PORT / GATEWAY_HOST_PORT / OUTPUT_HOST_PORT 控制，在 docker/.env 中配置
    ports:
      - "${DASHBOARD_HOST_PORT}:${DASHBOARD_CONTAINER_PORT}"   # Hermes Dashboard
      - "${GATEWAY_HOST_PORT}:${GATEWAY_CONTAINER_PORT}"       # Gateway / Feishu Webhook
      - "${OUTPUT_HOST_PORT}:${OUTPUT_CONTAINER_PORT}"         # Output file server
    volumes:
      # 整个项目目录挂载到容器内（上级目录 = patent-hermes-agent/）
      - ..:/app/patent-hermes-agent
      # Hermes 状态持久化（config.yaml / sessions / state.db / auth.json 等）
      - hermes-home:/root/.hermes
    env_file:
      - .env
    stdin_open: true
    tty: true
    working_dir: /app/patent-hermes-agent

volumes:
  hermes-home:
    name: patent-hermes-home